name: Verify Telegram private recipient
on:
  workflow_dispatch:
    inputs:
      pairing_phrase:
        description: Fresh ETF-CHECK phrase sent to your bot DM within 15 minutes (never a token)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telegram-recipient-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Sin-Yejun/etf-tracker'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Test verification safety without secrets or network
        run: python -m unittest test_telegram_verify -v
      - name: Verify bot and private recipient without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAIRING_PHRASE: ${{ inputs.pairing_phrase }}
        run: python telegram_verify.py
