name: Manual ETF quantity dry run
on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Official date (YYYY-MM-DD); archived demo is 2026-10-08
        required: true
        default: '2026-10-08'
        type: string
      probe_issuers:
        description: Download from the two official issuers (no notifications)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install hash-locked dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Test all original fixtures and safety rules
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_delivery_state -v
      - name: Run manual dry-run
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          PROBE_ISSUERS: ${{ inputs.probe_issuers }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--date "$AS_OF_DATE" --output output/manual-run)
          if [[ "$PROBE_ISSUERS" == 'true' ]]; then args+=(--probe); fi
          python -m etf_collector.collect "${args[@]}"
      - name: Retain results and bounded raw originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etf-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
