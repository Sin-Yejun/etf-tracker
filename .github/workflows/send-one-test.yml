name: Send one Telegram connection test
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEND_ONE_TEST to send exactly one connection-test message
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telegram-single-test
  cancel-in-progress: false
jobs:
  test-send:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true && github.repository == 'Sin-Yejun/etf-tracker'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Test sender without secrets or network
        run: python -m unittest test_telegram_test_send -v
      - name: Send one manually approved test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python telegram_test_send.py
